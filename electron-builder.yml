appId: com.shiguang.materials
# 注意:productName/executableName 保持「拾光素材库/ShiGuangMaterials」不变。
# 改名会同时改变 NSIS 安装目录与 exe 文件名,破坏 electron-updater 对老用户的
# 更新链路(装到新目录造成双安装、检测不到运行中的旧 exe)。用户可见的
# 快捷方式/卸载项名称已改用 LUMEN(见 nsis 段)。
productName: 拾光素材库
directories:
  buildResources: build
files:
  - 'out/**'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!.ui-shot/**'
win:
  executableName: ShiGuangMaterials
  icon: build/icon.ico
# macOS:未签名/未公证,首次打开需右键→打开或系统设置放行(见 README「macOS 安装」)
# CI(.github/workflows/build-mac.yml)在 macos-13(x64)/macos-14(arm64) 分别构建并上传 Release
mac:
  executableName: LUMEN
  icon: build/icon.icns
  category: public.app-category.graphics-design
  artifactName: Lumen-${version}-${arch}.${ext}
  target:
    - dmg
    - zip
asarUnpack:
  - '**/node_modules/ffmpeg-static/**'
nsis:
  artifactName: Lumen-${version}-setup.${ext}
  shortcutName: LUMEN
  uninstallDisplayName: LUMEN
  createDesktopShortcut: always
  # 安装目录选择(2026-08-19,里程碑 95):从一键安装改为向导式,允许用户改安装目录
  # (对标 Eagle;素材库是重度空间应用,用户常想装 D 盘)。为保住自动更新链路:
  #  - perMachine: false 保持每用户安装(默认目录仍是 %LOCALAPPDATA%\Programs\拾光素材库,
  #    用户可改到 D:\xxx 等每用户可写目录)
  #  - 不建议选 C:\Program Files(需管理员 + 更新需提权,会自动更新断链)
  #  - electron-updater 对 assisted + per-user 自定义目录的标准支持,老用户更新链不受影响
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
npmRebuild: true
# 自动更新源：GitHub Releases（yuanzhoucanxiang/shiguang-materials，仅发布安装包）
publish:
  provider: github
  owner: yuanzhoucanxiang
  repo: shiguang-materials
