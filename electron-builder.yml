appId: com.shiguang.materials
# productName = LUMEN(2026-08-22,里程碑 102):NSIS 安装向导标题、开始菜单、mac .app 名统一为 LUMEN。
# 安全依据(逐项核实):
#  - 运行时 userData 跟 asar 内 package.json 的 productName(已是 LUMEN,%APPDATA%\LUMEN),
#    与本字段无关,改名不影响用户配置/日志;
#  - exe 文件名由 win.executableName 单独控制,保持 ShiGuangMaterials 不变 → 升级原地覆盖
#    与运行中检测不受影响;
#  - 老用户升级时 NSIS 按注册表 InstallLocation 原地覆盖(2026-08-19 Temp\LumenCustomInstall
#    实验实证),不会双安装;NSIS 默认目录实测由 executableName 决定(2026-08-22 改名后静默
#    安装仍落 Programs\ShiGuangMaterials),新老用户目录完全一致。
productName: LUMEN
directories:
  buildResources: build
files:
  - 'out/**'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!.ui-shot/**'
win:
  executableName: ShiGuangMaterials
  icon: build/icon.ico
# macOS:未签名/未公证,首次打开需右键→打开或系统设置放行(见 README「macOS 安装」)
# CI(.github/workflows/build-mac.yml)在 macos-13(x64)/macos-14(arm64) 分别构建并上传 Release
mac:
  executableName: LUMEN
  icon: build/icon.icns
  category: public.app-category.graphics-design
  artifactName: Lumen-${version}-${arch}.${ext}
  target:
    - dmg
    - zip
asarUnpack:
  - '**/node_modules/ffmpeg-static/**'
nsis:
  artifactName: Lumen-${version}-setup.${ext}
  shortcutName: LUMEN
  uninstallDisplayName: LUMEN
  createDesktopShortcut: always
  # 安装目录选择(2026-08-19,里程碑 95):从一键安装改为向导式,允许用户改安装目录
  # (对标 Eagle;素材库是重度空间应用,用户常想装 D 盘)。为保住自动更新链路:
  #  - perMachine: false 保持每用户安装(默认目录 %LOCALAPPDATA%\Programs\ShiGuangMaterials,
  #    由 executableName 决定、与 productName 无关,用户可改到 D:\xxx 等每用户可写目录)
  #  - 不建议选 C:\Program Files(需管理员 + 更新需提权,会自动更新断链)
  #  - electron-updater 对 assisted + per-user 自定义目录的标准支持,老用户更新链不受影响
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
npmRebuild: true
# 自动更新源：GitHub Releases（yuanzhoucanxiang/shiguang-materials，仅发布安装包）
publish:
  provider: github
  owner: yuanzhoucanxiang
  repo: shiguang-materials
