name: Smoke

# 每次 push/PR 自动跑:类型检查 + CDP 冒烟回归(替代"想起来才跑测试")。
# 种子库(scripts/ci-seed-library.cjs)在全新 HOME 下生成接近真实形态的最小素材库,
# 应用通过 HOME 指向它,跑 CDP 测试的"稳定核心"子集(见下方 ITEST_EXCLUDE)。
# 说明:完整工作流无法在本地直接执行(需 Linux + xvfb),本地已用 APPDATA 指向种子库
# 验证过同一套测试在种子库上全绿。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cdp-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 生成种子测试库
        run: |
          export HOME="$RUNNER_TEMP/ci-home"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/ci-xdg"
          # 与本地验证一致:用 electron 的 node 模式跑(Electron-ABI 的 better-sqlite3)。
          # userData 在 Linux 由 XDG_CONFIG_HOME 决定(非 HOME env),必须显式指定。
          # 种子库建在默认库路径($HOME/EagleLike.library):itest-db-stmt 用 removeLibrary
          # 切库时会自动回到默认路径(与应用本地假设一致),不把后续测试带偏到空库
          ELECTRON_RUN_AS_NODE=1 node_modules/electron/dist/electron scripts/ci-seed-library.cjs \
            --lib "$HOME/EagleLike.library" --ud "$XDG_CONFIG_HOME/LUMEN"

      - name: CDP 冒烟回归(无头 xvfb)
        run: |
          export HOME="$RUNNER_TEMP/ci-home"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/ci-xdg"
          xvfb-run -a npm run test:itest
        env:
          # 套件集（里程碑 186）：运行器现在会"每个套件前探活 + 死了就重启 + 单套件超时 + 失败重试一次"，
          # 所以不再需要靠缩小子集来躲崩溃——历史证明在无头 Linux 上能跑过的渲染/交互套件已放回。
          # 仍然排除的只有两类：
          #   ① 依赖外部服务：itest-ai / itest-update-dialog（需要 AI Key 与更新接口）
          #   ② 历史上在无头 xvfb 下反复崩溃的重载/导入/重交互套件（board-file/floating/multi/nav/
          #      opacity-guides/tools/workspace、context-menu、drop-path、import-async、new、stage5、
          #      theme、toolbar）——崩溃现在不会再连累其它套件，但这几个本身在无头下过不去
          # 完整 30 套在本地发布前跑（npm run test:itest）。
          ITEST_EXCLUDE: itest-ai,itest-update-dialog,itest-board-file,itest-board-floating,itest-board-multi,itest-board-nav,itest-board-opacity-guides,itest-board-tools,itest-board-workspace,itest-context-menu,itest-drop-path,itest-import-async,itest-new,itest-stage5,itest-theme,itest-toolbar
          # 单套件超时与重启上限（默认 8 分钟 / 6 次，这里显式写出便于按 CI 观察调整）
          ITEST_SUITE_TIMEOUT_MS: "480000"
          ITEST_MAX_RESTARTS: "6"
          # GitHub Actions 容器缺用户命名空间,禁用 Chromium 沙箱
          ELECTRON_DISABLE_SANDBOX: "1"
LUMEN_HEADLESS: "1"
