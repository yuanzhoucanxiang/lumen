name: Smoke

# 每次 push/PR 自动跑:类型检查 + CDP 冒烟回归(替代"想起来才跑测试")。
# 种子库(scripts/ci-seed-library.cjs)在全新 HOME 下生成接近真实形态的最小素材库,
# 应用通过 HOME 指向它,跑 CDP 测试的"稳定核心"子集(见下方 ITEST_EXCLUDE)。
# 说明:完整工作流无法在本地直接执行(需 Linux + xvfb),本地已用 APPDATA 指向种子库
# 验证过同一套测试在种子库上全绿。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cdp-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 生成种子测试库
        run: |
          export HOME="$RUNNER_TEMP/ci-home"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/ci-xdg"
          # 与本地验证一致:用 electron 的 node 模式跑(Electron-ABI 的 better-sqlite3)。
          # userData 在 Linux 由 XDG_CONFIG_HOME 决定(非 HOME env),必须显式指定。
          # 种子库建在默认库路径($HOME/EagleLike.library):itest-db-stmt 用 removeLibrary
          # 切库时会自动回到默认路径(与应用本地假设一致),不把后续测试带偏到空库
          ELECTRON_RUN_AS_NODE=1 node_modules/electron/dist/electron scripts/ci-seed-library.cjs \
            --lib "$HOME/EagleLike.library" --ud "$XDG_CONFIG_HOME/LUMEN"

      - name: CDP 冒烟回归(无头 xvfb)
        run: |
          export HOME="$RUNNER_TEMP/ci-home"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/ci-xdg"
          xvfb-run -a npm run test:itest
        env:
          # 无头 Linux 上"重载/导入(sharp)/重渲染交互"类测试会让 Electron 挂起或崩溃(实测多次),
          # 故冒烟收敛为"不重渲染、不重交互"的稳定核心:DB/IPC 开关(db-stmt)、设置中心 UI
          # (settings-guide)、Agent HTTP 与库操作(agent-api)、备份往返(backup-restore)、
          # 拼音索引(pinyin)、基础健康与 asset://(itest.cjs)。完整 30 套在本地发布前跑。
          #
          # 2026-10-07 复现记录(当时 CI 红绿交替,同一份代码一次绿一次红——纯环境 flake,非产品 bug):
          # v0.8.36 release 提交:itest-agent-panel 挂起 3.5 分钟后应用进程死亡 → 其后 12 个套件
          #   全部 ECONNREFUSED 连锁失败;v0.8.35 docs 提交:itest-board-orig-px 挂起 5 分钟后同样连锁。
          # 失败点每次都不同,且成功那次 13 个套件 55 秒跑完 → 判定为 xvfb 下的环境性挂起。
          # 故把渲染/交互重的套件移出冒烟,保留上面 6 个纯逻辑/UI 壳套件。
          ITEST_EXCLUDE: itest-ai,itest-update-dialog,itest-agent-panel,itest-board-file,itest-board-floating,itest-board-interact,itest-board-multi,itest-board-nav,itest-board-opacity-guides,itest-board-orig-px,itest-board-perf,itest-board-tools,itest-board-viewport,itest-board-workspace,itest-context-menu,itest-drop-path,itest-import-async,itest-new,itest-screenshot,itest-stage5,itest-theme,itest-toolbar,itest-url-import
          # GitHub Actions 容器缺用户命名空间,禁用 Chromium 沙箱
          ELECTRON_DISABLE_SANDBOX: "1"
          LUMEN_HEADLESS: "1"
